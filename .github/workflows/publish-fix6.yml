name: Publish FIX6 Release

on:
  push:
    paths:
      - ".github/workflows/publish-fix6.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing FIX6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          gh run download 37767987095 --repo zionzangar/KIT-Scenarist-VN-CZ --name KIT_Scenarist_VN_CZ_FIX6 --dir out

      - name: Publish FIX6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create fix6 out/KIT_Scenarist_VN_CZ_FIX6.zip --repo zionzangar/KIT-Scenarist-VN-CZ --title "KIT Scenarist VN CZ FIX6" --notes "Portable Windows x64 build. Adds free Story Map mode in Cards with draggable scene placement and flow connector arrows. Also includes Czech UI, Czech spellcheck, Visual Novel CZ template, chapter printing, editor-template export, stable VN prefixes, and lowercase template option."
